<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b11" />
  <meta name="description" content="OpenJarvis — on-device AI assistant" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.ico" />
  <title>OpenJarvis</title>
  <style>
    /* Ambient video theme: paints before React boots and stays as the
       app's background theme; panels go translucent over it (themes.ts). */
    #boot-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: #05080f;
    }
    #boot-bg video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }
    /* Light tint only — the app's panels now go translucent over the video
       (see applyAppearance in src/lib/themes.ts), which provides the rest
       of the dimming while keeping the video properly visible. */
    #boot-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 15, 0.25);
    }
    #root { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div id="boot-bg" aria-hidden="true">
    <video src="/avatar/intro.mp4" autoplay muted loop playsinline></video>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
