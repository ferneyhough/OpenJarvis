<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenJarvis Avatar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    overflow: hidden;
    height: 100%;
    font-family: system-ui, sans-serif;
    cursor: pointer;
  }
  /* Notification-style card: dark pill, soft border, drop shadow. */
  #card {
    margin: 6px;
    padding: 6px;
    border-radius: 16px;
    background: rgba(8, 13, 22, 0.88);
    border: 1px solid rgba(103, 232, 249, 0.35);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
  }
  /* Layered avatar (same layers as the main window's TalkingAvatar). */
  .ta {
    position: relative;
    width: 100%;
    aspect-ratio: 91 / 50; /* matches the layer images */
    overflow: hidden;
    border-radius: 10px;
    background: #05080f;
  }
  .ta img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .ta .ta-jaw { will-change: transform; }
  .ta .ta-eyes {
    mix-blend-mode: screen;
    opacity: 0;
    will-change: opacity;
  }
</style>
</head>
<body title="Click to bring OpenJarvis to the front">
  <div id="card">
    <div class="ta" id="ta">
      <img src="/avatar/avatar_base.png" alt="" />
      <img class="ta-jaw" id="taJaw" src="/avatar/avatar_jaw.png" alt="" />
      <img class="ta-eyes" id="taEyes" src="/avatar/avatar_eyes_glow.png" alt="" />
    </div>
  </div>
<script>
(function () {
  var jaw = document.getElementById('taJaw');
  var eyes = document.getElementById('taEyes');
  var MAX_DROP_PCT = 2.8;   // same travel as the main window avatar
  var level = 0;            // smoothed level actually displayed
  var target = 0;           // latest level from the main window
  var speaking = false;
  var lastMsg = 0;

  // Speech data arrives from the main window via avatarSync.ts.
  if ('BroadcastChannel' in window) {
    var bc = new BroadcastChannel('jarvis-avatar');
    bc.onmessage = function (ev) {
      var d = ev.data || {};
      if (d.type !== 'avatar-tts') return;
      speaking = !!d.speaking;
      target = speaking ? Math.max(0, Math.min(1, +d.level || 0)) : 0;
      lastMsg = performance.now();
    };
  }

  function frame() {
    // If the main window went quiet without a final "stop" (e.g. it was
    // closed), let the jaw settle shut on its own.
    if (speaking && performance.now() - lastMsg > 400) {
      speaking = false;
      target = 0;
    }
    // Fast open, slow close — matches the main window avatar's feel.
    var rate = target > level ? 0.55 : 0.16;
    level += (target - level) * rate;
    if (level < 0.003) level = target === 0 ? 0 : level;
    jaw.style.transform = 'translateY(' + (level * MAX_DROP_PCT).toFixed(3) + '%)';
    eyes.style.opacity = speaking || level > 0.02 ? String(Math.min(1, 0.25 + level)) : '0';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Click: ask the desktop host to bring the main window back to the front.
  document.body.addEventListener('click', function () {
    try {
      var api = window.pywebview && window.pywebview.api;
      if (api && api.focus_main_window) api.focus_main_window();
    } catch (e) { /* not in the desktop host */ }
  });
})();
</script>
</body>
</html>
