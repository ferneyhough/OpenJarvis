<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Talking Avatar - Test Page</title>
<link rel="stylesheet" href="talking-avatar.css">
<style>
  body { background:#04090f; color:#cfeaff; font-family:system-ui, sans-serif; margin:24px; }
  #avatar { width:min(720px, 92vw); border:1px solid #12384d; border-radius:10px; }
  .pill-banner { width:min(720px, 92vw); height:44px; border:1.5px solid #2b7ba6; border-radius:999px;
    display:flex; align-items:center; justify-content:center; color:#7fd4ff; font-size:13px;
    letter-spacing:.12em; background:rgba(10,40,60,.35); margin-bottom:14px; box-sizing:border-box; }
  .chat-spot { width:min(720px, 92vw); min-height:64px; border:1.5px solid #2b7ba6; border-radius:14px;
    display:flex; align-items:center; justify-content:center; color:#7fd4ff; font-size:13px;
    letter-spacing:.12em; background:rgba(10,40,60,.35); margin-top:14px; box-sizing:border-box; }
  .row { margin:14px 0; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button, input[type=text] { background:#0a2233; color:#cfeaff; border:1px solid #1d5b7a;
    border-radius:999px; padding:9px 16px; font-size:15px; }
  input[type=text] { border-radius:8px; min-width:300px; }
  button { cursor:pointer; } button:hover { background:#0f3049; }
  label { font-size:14px; opacity:.85; }
</style>
</head>
<body>
<h2>Steampunk Robot - Talking Avatar Test</h2>
<!-- Layout matches the locked intro's final frame: pill banner spot on top,
     avatar centre, chat box spot below. The banner/chat spots stay EMPTY here -
     in the real app your interface elements live in them. -->
<div class="pill-banner">PILL BANNER SPOT - YOUR INTERFACE GOES HERE</div>
<div id="avatar"></div>
<div class="chat-spot">CHAT BOX SPOT</div>

<div class="row">
  <button id="speakLine">Speak the startup line</button>
  <input type="text" id="customText" placeholder="Type anything for him to say">
  <button id="speakCustom">Speak it</button>
</div>
<div class="row">
  <label>Manual jaw test (drag while watching him):</label>
  <input type="range" id="level" min="0" max="100" value="0" style="width:260px">
</div>
<div class="row">
  <label>Or play a voice audio file through him:</label>
  <input type="file" id="audioFile" accept="audio/*">
  <audio id="voiceAudio" controls style="display:none"></audio>
</div>

<script src="talking-avatar.js"></script>
<script>
  const avatar = new TalkingAvatar(document.getElementById('avatar'));
  const LINE = 'System activation complete. AI model online and fully operational. Welcome, I am now fully integrated and ready to assist you.';
  document.getElementById('speakLine').onclick = () => avatar.speakText(LINE);
  document.getElementById('speakCustom').onclick = () => {
    const t = document.getElementById('customText').value.trim();
    if (t) avatar.speakText(t);
  };
  document.getElementById('level').oninput = e => avatar.setLevel(e.target.value / 100);
  document.getElementById('audioFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const a = document.getElementById('voiceAudio');
    a.src = URL.createObjectURL(f); a.style.display = 'block';
    avatar.attachAudio(a); a.play();
  };
  if (speechSynthesis.getVoices().length === 0) speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
